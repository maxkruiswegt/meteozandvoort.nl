<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme: a stored
      // light/dark choice wins, otherwise follow the OS. useTheme takes over after mount.
      (function () {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') pref = stored;
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical, hreflang and Open Graph tags come from
         src/seo/site.ts: written per page at build time (build/seoPages.ts)
         and kept up to date at runtime by @unhead/vue. -->
    <!-- Light by default, dark when the OS asks for it. The meta applies before CSS loads. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)" />
    <!-- Paints the page colour before main.css loads. :where() keeps it at zero
         specificity: the build reorders the head and puts this after main.css,
         which must still win. -->
    <style>
      :where(html, body) {
        background-color: #f6f3ee;
        margin: 0;
        padding: 0;
      }

      :where(html[data-theme='dark'], html[data-theme='dark'] body) {
        background-color: #0a0f1a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
