name: Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to full commit SHAs: tags and branches are mutable, and
# the appleboy actions receive the SSH private key.
jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies and Build Frontend
        run: |
          npm ci
          npm run build

      - name: Clear Web Server Directory
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master 2026-08-16 (v1.2.5 + drone-ssh 1.8.4 checksum check)
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            target="${{ secrets.PROJECT_PATH }}"
            rm -rf "${target:?PROJECT_PATH secret is not set}"/*

      - name: Copy Built Files to Web Server
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # master 2026-08-09 (v1.0.0 + fixes)
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: 'dist/*'
          target: ${{ secrets.PROJECT_PATH }}
          strip_components: 1
