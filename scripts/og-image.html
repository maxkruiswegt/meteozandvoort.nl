<!doctype html>
<!--
  Source of public/img/og.jpg and og-en.jpg (?lang=en), the 1200x630 link previews. Rendered by
  scripts/export-og.mjs (npm run export:og); paths are relative to this file.
-->
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }

      html,
      body {
        margin: 0;
      }

      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0f1a url('../public/img/background.webp') 40% 50% / cover no-repeat;
        font-family: 'Archivo', system-ui, sans-serif;
        color: #e8edf6;
      }

      /* Navy behind the text, then an eased fade over the trees so the sunset stays clear. The fade
         starts 60px past the text's right edge (about 630px) and its first stretch barely lightens,
         so the dark margin right of the text reads about as wide as the 80px on the left. Many stops
         make it leave the dark slowly; a straight fade shows a hard edge where it starts. */
      .og::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgb(10 15 26 / 0.92) 0,
            rgb(10 15 26 / 0.9) 690px,
            rgb(10 15 26 / 0.87) 735px,
            rgb(10 15 26 / 0.81) 780px,
            rgb(10 15 26 / 0.72) 822px,
            rgb(10 15 26 / 0.61) 870px,
            rgb(10 15 26 / 0.49) 918px,
            rgb(10 15 26 / 0.37) 970px,
            rgb(10 15 26 / 0.26) 1025px,
            rgb(10 15 26 / 0.16) 1078px,
            rgb(10 15 26 / 0.08) 1125px,
            rgb(10 15 26 / 0.03) 1168px,
            rgb(10 15 26 / 0) 1200px
          ),
          linear-gradient(0deg, rgb(10 15 26 / 0.55) 0%, rgb(10 15 26 / 0) 40%);
      }

      .text {
        position: absolute;
        left: 80px;
        top: 0;
        bottom: 0;
        width: 580px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }

      /* The icon's navy circle would vanish into the navy shade; a hairline ring keeps its shape. */
      .icon {
        width: 76px;
        height: 76px;
        margin-bottom: 4px;
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgb(148 163 199 / 0.22);
      }

      h1 {
        margin: 0;
        font-size: 70px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        font-size: 28px;
        line-height: 1.3;
        color: #c3ccdb;
      }

      .measures {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }

      .measures span {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 14px 7px 12px;
        border: 1px solid rgb(148 163 199 / 0.28);
        border-radius: 999px;
        background: rgb(18 26 42 / 0.7);
        font-size: 20px;
        font-weight: 550;
      }

      .measures i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .domain {
        margin-top: 6px;
        font-size: 24px;
        font-weight: 600;
        color: #ec6a57;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="text">
        <img
          class="icon"
          src="../public/favicon.svg"
          alt=""
        />
        <h1>Meteo Zandvoort</h1>
        <p>Het actuele weer in Zandvoort, rechtstreeks van het weerstation van Herman Kruiswegt.</p>
        <div class="measures">
          <span><i style="background: #f9b449"></i>Temperatuur</span>
          <span><i style="background: #5fcef9"></i>Wind</span>
          <span><i style="background: #4aa3fc"></i>Neerslag</span>
          <span><i style="background: #d8cbb4"></i>Luchtdruk</span>
        </div>
        <div class="domain">meteozandvoort.nl</div>
      </div>
    </div>
    <script>
      // ?lang=en swaps in the English text; the markup above is the Dutch original.
      const english = {
        lang: 'en-GB',
        intro: "The current weather in Zandvoort, straight from Herman Kruiswegt's weather station.",
        measures: ['Temperature', 'Wind', 'Rain', 'Air pressure'],
      };
      if (new URLSearchParams(location.search).get('lang') === 'en') {
        document.documentElement.lang = english.lang;
        document.querySelector('p').textContent = english.intro;
        document.querySelectorAll('.measures span').forEach((chip, i) => {
          chip.lastChild.textContent = english.measures[i];
        });
      }
    </script>
  </body>
</html>
